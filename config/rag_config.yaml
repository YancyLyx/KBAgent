# RAG 配置文件

# 向量存储后端：chroma（默认，本地 PersistentClient）| milvus（Standalone，内置 BM25+RRF）
vector_store:
  # 2026-08-27 产品默认切 Milvus（制度库 172 chunks 已迁移，规模选型结论见
  # rag_retrieval.md「规模化落地」；Chroma 保留可切回：VECTOR_STORE_BACKEND=chroma）
  backend: milvus
  milvus:
    uri: http://localhost:19530
    collection: knowledge_base
    default_partition: kb_default
    consistency: Bounded
    dim: 512

chunk_strategy:
  chunk_size: 1000
  chunk_overlap: 100
  separators: ["\n\n", "\n", "。", "，", " ", ""]

parent_child:
  enabled: true
  child_chunk_size: 300
  child_chunk_overlap: 30
  separators: ["\n\n", "\n", "。", "，", " ", ""]

retrieval_strategy:
  search_type: hybrid
  rrf_k: 60
  vector_top_k: 10
  keyword_top_k: 10
  rerank_top_k: 3
  # 重排层增强默认全开（精排之后的噪声控制与去冗余）：
  # - score_threshold：相关性阈值过滤（min_rerank_score 默认值），
  #   低于阈值的文档不喂给 LLM
  # - autocut：分数悬崖动态截断，重排后 top_k 内相对落差超过 drop_ratio 时
  #   在断层处截断（至少保留 1 条）
  # - diversity_rerank：MMR 去冗余，避免 top-k 语义重复
  score_threshold: 0.5
  autocut: true
  autocut_drop_ratio: 0.3
  diversity_rerank: true

embedding:
  model_name: BAAI/bge-small-zh
  device: cpu
  normalize_embeddings: true

rerank:
  model_name: BAAI/bge-reranker-base
  device: cpu
  max_length: 512
